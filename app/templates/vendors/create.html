{% extends 'layouts/base.html' %}

{% block title %}Add Vendor | Martech TMS{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
    <div>
        <h3 class="fw-bold mb-1">Add Vendor</h3>
        <p class="text-muted small mb-0">Register a new tracking partner or advertising network.</p>
    </div>
    <a href="{{ url_for('vendors.index') }}" class="btn btn-light btn-sm border">Cancel</a>
</div>

<form method="POST" action="{{ url_for('vendors.create') }}" class="row g-3">
    <div class="col-12">
        <label class="form-label fw-semibold">Vendor Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" placeholder="e.g. TikTok Events API" required>
    </div>

    <div class="col-12">
        <label class="form-label fw-semibold">About / Description</label>
        <textarea name="about" class="form-control" rows="3" placeholder="Brief overview of the vendor platform..."></textarea>
    </div>

    <div class="col-12">
        <label class="form-label fw-semibold">Business Reason for Usage</label>
        <input type="text" name="reason" class="form-control" placeholder="e.g. Conversion tracking for regional social campaigns">
    </div>

    <div class="col-12 col-md-6">
        <label class="form-label fw-semibold">Tag Purpose</label>
        <textarea name="tag_purpose" class="form-control" rows="3" placeholder="e.g. Retargeting and view-through attribution"></textarea>
    </div>

    <div class="col-12 col-md-6">
        <label class="form-label fw-semibold">Collected Data</label>
        <textarea name="collected_data" class="form-control" rows="3" placeholder="e.g. Hashed email, transaction value, currency, product ID"></textarea>
    </div>

    <div class="col-12 text-end mt-4">
        <button type="submit" class="btn btn-primary px-4">Save Vendor</button>
    </div>
</form>
{% endblock %}
