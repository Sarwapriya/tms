<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Martech TMS</title>

    <!-- CSS Dependencies -->
    <link href="{{ base_url('assets/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ base_url('assets/bootstrap-icons/bootstrap-icons.css') }}" rel="stylesheet">

    <style>
        :root {
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --color-primary: #0071E3;
            --color-primary-hover: #0077ED;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #090a0f 0%, #12131c 50%, #1e112a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            margin: 0;
            padding: 20px;
        }

        /* Glowing backdrops */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: #0071E3;
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #a855f7;
            bottom: -100px;
            right: -100px;
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            padding: 45px 40px;
            z-index: 10;
            color: #f5f5f7;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px 0 rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Logo & Header */
        .brand-logo {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 8px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            filter: drop-shadow(0 2px 8px rgba(0, 113, 227, 0.3));
        }

        .brand-subtitle {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            margin-bottom: 35px;
            font-weight: 400;
        }

        /* Form Controls */
        .glass-input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .glass-input-group i.input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.35);
            font-size: 1.1rem;
            transition: color 0.3s ease;
            pointer-events: none;
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.04) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 14px !important;
            padding: 15px 16px 15px 48px !important;
            color: #ffffff !important;
            font-size: 0.95rem !important;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
            width: 100%;
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .glass-input:focus {
            border-color: var(--color-primary) !important;
            background: rgba(255, 255, 255, 0.08) !important;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.25) !important;
            outline: none;
        }

        .glass-input:focus+i.input-icon {
            color: var(--color-primary);
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.35);
            cursor: pointer;
            z-index: 10;
            transition: color 0.3s ease;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: #ffffff;
        }

        /* Button */
        .glass-btn {
            background: var(--color-primary);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 15px 20px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(0, 113, 227, 0.35);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .glass-btn:hover {
            background: var(--color-primary-hover);
            box-shadow: 0 6px 22px rgba(0, 113, 227, 0.45);
            transform: translateY(-1px);
        }

        .glass-btn:active {
            transform: translateY(1px);
        }

        /* Apple Alert Override */
        .alert-glass {
            background: rgba(222, 53, 53, 0.08);
            border: 1px solid rgba(222, 53, 53, 0.2);
            color: #ff6b6b;
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.85rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-glass-success {
            background: rgba(29, 138, 68, 0.08);
            border: 1px solid rgba(29, 138, 68, 0.2);
            color: #51cf66;
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.85rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Drawer Helper styles */
        .drawer-toggle-container {
            text-align: center;
            margin-top: 25px;
        }

        .drawer-toggle-btn {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
            padding-bottom: 2px;
        }

        .drawer-toggle-btn:hover {
            color: var(--color-primary);
            border-color: var(--color-primary);
        }

        .users-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), padding 0.4s cubic-bezier(0.16, 1, 0.3, 1), margin-top 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 0 solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }

        .users-drawer.show {
            max-height: 300px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 18px;
            margin-top: 15px;
            pointer-events: auto;
        }

        .drawer-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .user-pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .user-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .user-pill:hover {
            background: rgba(0, 113, 227, 0.1);
            border-color: var(--color-primary);
            color: #ffffff;
        }

        .password-info {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }
    </style>
</head>

<body>

    <!-- Glowing Background Elements -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Login Container -->
    <div class="glass-card">
        <div class="brand-logo">
            <i class="bi bi-shield-lock-fill text-primary"></i>
            <span>Martech TMS</span>
        </div>
        <div class="brand-subtitle">Enter your credentials to access the system</div>

        <!-- Feedback Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{{ 'alert-glass-success' if category == 'success' else 'alert-glass' }}">
                        <i class="bi {{ 'bi-check-circle-fill' if category == 'success' else 'bi-exclamation-triangle-fill' }}"></i>
                        <div>{{ message }}</div>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form action="{{ site_url('login') }}" method="post">
            {{ csrf_field() }}

            <div class="glass-input-group">
                <input type="text" name="username" id="username" class="glass-input" placeholder="Username" required
                    value="{{ old('username') }}" autocomplete="username">
                <i class="bi bi-person-fill input-icon"></i>
            </div>

            <div class="glass-input-group">
                <input type="password" name="password" id="password" class="glass-input" placeholder="Password" required
                    autocomplete="current-password">
                <i class="bi bi-lock-fill input-icon"></i>
                <button type="button" class="password-toggle" id="togglePasswordBtn">
                    <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                </button>
            </div>

            <button type="submit" class="glass-btn">
                <span>Sign In</span>
                <i class="bi bi-arrow-right-short" style="font-size: 1.25rem;"></i>
            </button>
        </form>
    </div>

    <!-- JS Dependencies -->
    <script src="{{ base_url('assets/jquery/js/jquery.min.js') }}"></script>
    <script src="{{ base_url('assets/bootstrap/js/bootstrap.bundle.min.js') }}"></script>

    <script>
        $(document).ready(function () {
            // Password visibility toggle
            $('#togglePasswordBtn').on('click', function () {
                const passwordField = $('#password');
                const icon = $('#togglePasswordIcon');

                if (passwordField.attr('type') == 'password') {
                    passwordField.attr('type', 'text');
                    icon.removeClass('bi-eye-slash').addClass('bi-eye');
                } else {
                    passwordField.attr('type', 'password');
                    icon.removeClass('bi-eye').addClass('bi-eye-slash');
                }
            });
        });
    </script>
</body>

</html>
